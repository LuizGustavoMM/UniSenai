[pytest]
; Garante que a raiz do repositorio (onde fica frenagem_service.py) seja
; adicionada ao sys.path durante a coleta de testes. Sem isso, o pytest
; so insere automaticamente a pasta tests/ no sys.path (por nao haver
; __init__.py nela), e o import "from frenagem_service import ..." falha
; com ModuleNotFoundError ao rodar pytest a partir da raiz do projeto.
pythonpath = .
